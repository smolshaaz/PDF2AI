[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2ai-desktop"
version = "1.1.0"
description = "Private local desktop PDF to Markdown conversion"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PySide6==6.11.2",
  "pymupdf4llm==1.28.2",
  "rapidocr==3.9.2",
  "onnxruntime==1.29.0",
  "python-bidi==0.6.7",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0"]
build = ["pyinstaller==6.22.2"]

[project.gui-scripts]
pdf2ai = "pdf2ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2ai = ["assets/SOURCES.md", "assets/fonts/*", "assets/models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["integration: actual PDF and OCR extraction"]
